[build-system]
requires = ["setuptools>=68.0", "wheel>=0.41.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ocr-vibe"
version = "2.0.0"
description = "Production-ready OCR application with multiple engines, PDF support, GUI/CLI interfaces, and plugin system"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "OCR-VIBE Contributors"},
]
keywords = ["ocr", "easyocr", "tesseract", "pdf", "text-extraction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "numpy>=1.21.0",
    "pillow>=8.0.0",
    "opencv-python>=4.5.0",
    "psutil>=5.8.0",
    "pyyaml>=6.0",
    "easyocr>=1.6.0",
    "paddleocr>=2.7.0",
    "pytesseract>=0.3.9",
    "pdfplumber>=0.6.0",
    "PyPDF2>=2.0.0",
    "PyMuPDF>=1.20.0",
    "pdf2image>=1.16.0",
    "camelot-py[cv]>=0.7.0",
    "pyspellchecker>=0.7.0",
    "scikit-learn>=1.0.0",
    "click>=8.0.0",
    "tqdm>=4.64.0",
    "flet>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "pyinstaller>=5.0.0",
]
optional = [
    "python-docx>=0.8.11",
]
all = [
    "python-docx>=0.8.11",
]

[project.urls]
Homepage = "https://github.com/OCR-VIBE/OCR-VIBE"
Repository = "https://github.com/OCR-VIBE/OCR-VIBE"
"Bug Tracker" = "https://github.com/OCR-VIBE/OCR-VIBE/issues"

[project.scripts]
ocr-vibe = "src.cli_app:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint.per-file-ignores]
# BLE001 (blind-except) is allowed in this project: catching `Exception` is a
# deliberate resilience boundary, not an oversight. The OCR pipeline must never
# abort the whole application because one page, one file or one engine failed.
# Every one of these handlers logs the error and degrades gracefully.
"main.py" = ["BLE001"]
"src/batch_queue.py" = ["BLE001"]
"src/cli_app.py" = ["BLE001"]
"src/gui_flet.py" = ["BLE001"]
"src/memory_manager.py" = ["BLE001"]
"src/ocr_engine.py" = ["BLE001"]
"src/pdf_handler.py" = ["BLE001"]
"src/stats_tracker.py" = ["BLE001"]
"test_flet.py" = ["BLE001"]
